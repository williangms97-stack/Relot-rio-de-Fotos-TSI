# Mantém o projeto gratuito do Supabase ativo.
# O plano gratuito pausa o projeto depois de 7 dias sem uso (ex.: entressafra). Esta tarefa
# chama a função tsi_ping (supabase/03_espaco.sql) a cada 3 dias. Ela não lê nem grava dados.
# Usa só a chave pública, a mesma que já está em tsi-dois-marcos/js/core/servidor.js.
# Para rodar na hora: GitHub → Actions → "Manter o Supabase ativo" → Run workflow.
name: Manter o Supabase ativo

on:
  schedule:
    - cron: '17 11 */3 * *'   # a cada 3 dias, 08:17 de Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar tsi_ping
        env:
          URL: https://qxqmsvrqjvzhorjhqpfa.supabase.co
          CHAVE_PUBLICA: sb_publishable_DT0xrdIu-IdO5J3sf3JGzQ_lDxjQhK3
        run: |
          for tentativa in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 \
                 -X POST "$URL/rest/v1/rpc/tsi_ping" \
                 -H "apikey: $CHAVE_PUBLICA" -H "Content-Type: application/json" -d '{}'; then
              echo; echo "Supabase respondeu."; exit 0
            fi
            echo "Tentativa $tentativa falhou; tentando de novo em 60 s."; sleep 60
          done
          echo "O Supabase não respondeu. Confira se o projeto está pausado (supabase.com/dashboard)."; exit 1
